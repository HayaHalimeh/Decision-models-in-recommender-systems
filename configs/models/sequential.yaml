# Trained sequential recommenders (RecBole); grids are searched on the validation targets.
sasrec:
  group: sequential
  display: SASRec
  deployment: local
  open: true
  recbole_model: SASRec
  fixed: {n_layers: 2, n_heads: 2, hidden_size: 64, inner_size: 256, loss_type: CE}
  grid:
    learning_rate: [0.001, 0.0005]
    hidden_dropout_prob: [0.2, 0.5]
  tied: {attn_dropout_prob: hidden_dropout_prob}
bert4rec:
  group: sequential
  display: BERT4Rec
  deployment: local
  open: true
  recbole_model: BERT4Rec
  fixed: {n_layers: 2, n_heads: 2, hidden_size: 64, inner_size: 256, loss_type: CE}
  grid:
    learning_rate: [0.001, 0.0005]
    mask_ratio: [0.2, 0.6]
gru4rec:
  group: sequential
  display: GRU4Rec
  deployment: local
  open: true
  recbole_model: GRU4Rec
  fixed: {embedding_size: 64, hidden_size: 128, num_layers: 1, loss_type: CE}
  grid:
    learning_rate: [0.001, 0.0005]
    dropout_prob: [0.2, 0.5]
