[project]
name = "dm4recsys"
version = "0.1.0"
description = "decision models as zero-shot rankers"
requires-python = ">=3.11,<3.12"
dependencies = [
    "recbole==1.2.1",
    "torch==2.5.1",
    "numpy==1.26.4",
    "scipy==1.13.1",
    "pandas==2.2.3",
    "scikit-learn==1.5.2",
    "pyyaml==6.0.2",
    "tqdm==4.67.1",
    "colorlog==4.7.2",
    "colorama==0.4.4",
    "tabulate==0.9.0",
    "texttable==1.7.0",
    "thop==0.1.1.post2209072238",
    "tensorboard==2.18.0",
    "plotly==5.24.1",
    "psutil==6.1.0",
    "transformers==4.57.1",
    "sentence-transformers==5.1.2",
    "openai==1.57.0",
    "httpx==0.27.2",
    "python-dotenv==1.0.1",
    "requests==2.32.3",
    "matplotlib==3.9.3",
    "statsmodels==0.14.4",
    "pytest==8.3.4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
]
